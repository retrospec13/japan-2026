<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f8fafc">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>Japan Journey 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
<style>
/* ==========================================================================
   Japan Journey 2026 · Tokyo Modern Minimal Theme (Exact Pixel Polish)
   ========================================================================== */

:root {
  --bg: #f8fafc;
  --panel: #ffffff;
  --panel-gray: #f3f4f6;
  --ink: #111827;
  --ink-secondary: #4b5563;
  --muted: #9ca3af;
  --border-card: #e5e7eb;
  --orange: #ff5722;
  --orange-light: #fff2ed;
  --orange-border: #ff7a50;
  --blue: #2563eb;
  --blue-light: #eff6ff;
  --radius-card: 20px;
  --radius-inner: 14px;
  --radius-pill: 999px;
  --shadow-card: 0 2px 12px rgba(0, 0, 0, 0.04);
  --shadow-dock: 0 10px 30px rgba(0, 0, 0, 0.1), 0 2px 8px rgba(0, 0, 0, 0.04);
}

* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font: 14.5px/1.5 -apple-system, BlinkMacSystemFont, "Plus Jakarta Sans", "SF Pro Display", "Segoe UI", Roboto, sans-serif;
  -webkit-font-smoothing: antialiased;
  padding-bottom: 96px;
}

a { color: inherit; text-decoration: none; }
button { font: inherit; outline: none; }

.app-container {
  max-width: 580px;
  margin: 0 auto;
  min-height: 100vh;
  padding: 16px 14px 40px;
}

/* --------------------------------------------------------------------------
   1. Brand Header
   -------------------------------------------------------------------------- */
.header-wrap {
  margin-bottom: 14px;
}

.header-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  margin-bottom: 10px;
}

.header-title {
  margin: 0;
  font-size: 24px;
  font-weight: 800;
  letter-spacing: -0.03em;
  color: var(--ink);
  line-height: 1.1;
}

.day-badge-top {
  background: #ffffff;
  color: var(--ink-secondary);
  border: 1px solid var(--border-card);
  padding: 5px 12px;
  border-radius: var(--radius-pill);
  font-size: 12px;
  font-weight: 600;
  white-space: nowrap;
  box-shadow: 0 1px 2px rgba(0,0,0,0.02);
}

.avatar-crew-row {
  display: flex;
  align-items: center;
  gap: 10px;
}

.avatar-group {
  display: flex;
  align-items: center;
}

.avatar-group img {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  object-fit: cover;
  border: 2px solid #ffffff;
  margin-left: -9px;
  box-shadow: 0 2px 5px rgba(0,0,0,0.08);
}

.avatar-group img:first-child {
  margin-left: 0;
}

.crew-names-text {
  font-size: 12.5px;
  line-height: 1.3;
  color: var(--ink-secondary);
  font-weight: 600;
}

/* --------------------------------------------------------------------------
   2. Bento Hero Card (Compact, Exact Layout, No Overflow)
   -------------------------------------------------------------------------- */
.bento-card {
  background: #ffffff;
  border: 1.5px solid var(--orange-border);
  border-radius: var(--radius-card);
  padding: 14px 14px;
  margin-bottom: 16px;
  box-shadow: var(--shadow-card);
}

.bento-header-line {
  font-size: 13px;
  font-weight: 700;
  color: var(--orange);
  margin-bottom: 12px;
  display: flex;
  align-items: center;
  gap: 5px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.bento-content-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}

.bento-stats-group {
  display: flex;
  align-items: center;
  gap: 8px;
}

.bento-stat-col {
  display: flex;
  flex-direction: column;
  padding-right: 8px;
  border-right: 1px solid #f3f4f6;
}

.bento-stat-col:last-child {
  border-right: none;
  padding-right: 0;
}

.bento-stat-top {
  display: flex;
  align-items: center;
  gap: 3px;
  font-size: 15px;
  font-weight: 800;
  color: var(--ink);
  line-height: 1;
}

.bento-stat-top svg {
  width: 14px;
  height: 14px;
  color: #6b7280;
  flex-shrink: 0;
}

.bento-stat-sub {
  font-size: 10px;
  color: var(--muted);
  font-weight: 600;
  margin-top: 2px;
}

.bento-action-btn {
  background: var(--orange);
  color: #ffffff;
  border: none;
  border-radius: var(--radius-pill);
  padding: 8px 12px;
  font-size: 11.5px;
  font-weight: 700;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 4px;
  white-space: nowrap;
  flex-shrink: 0;
  box-shadow: 0 2px 8px rgba(255, 87, 34, 0.25);
  transition: transform 0.15s ease, background-color 0.15s ease;
}

.bento-action-btn:hover {
  background: #e64a19;
}

/* --------------------------------------------------------------------------
   3. Segmented Switcher (Feed vs Live Map)
   -------------------------------------------------------------------------- */
.switcher-bar {
  background: var(--panel-gray);
  padding: 3px;
  border-radius: var(--radius-pill);
  display: flex;
  gap: 3px;
  margin-bottom: 16px;
}

.switcher-btn {
  flex: 1;
  border: none;
  background: transparent;
  padding: 9px 16px;
  border-radius: var(--radius-pill);
  font-size: 14px;
  font-weight: 700;
  color: var(--ink-secondary);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  transition: all 0.15s ease;
}

.switcher-btn.active {
  background: var(--ink);
  color: #ffffff;
  box-shadow: 0 1px 4px rgba(0, 0, 0, 0.12);
}

/* --------------------------------------------------------------------------
   4. Story Post Cards (Clean Visual Hierarchy)
   -------------------------------------------------------------------------- */
.story-feed {
  display: grid;
  gap: 18px;
}

.story-card {
  background: var(--panel);
  border: 1px solid var(--border-card);
  border-radius: var(--radius-card);
  padding: 14px;
  box-shadow: var(--shadow-card);
  overflow: hidden;
}

/* Top Hero Media inside card */
.story-hero-media {
  width: 100%;
  border-radius: var(--radius-inner);
  overflow: hidden;
  background: #1e293b;
  position: relative;
  cursor: pointer;
  margin-bottom: 12px;
}

.story-hero-media img,
.story-hero-media video {
  width: 100%;
  height: 220px;
  object-fit: cover;
  display: block;
  transition: transform 0.25s ease;
}

.story-hero-media:hover img {
  transform: scale(1.02);
}

.story-content-wrap {
  padding: 0 2px 2px;
}

.story-title {
  margin: 0;
  font-size: 18px;
  font-weight: 800;
  color: var(--ink);
  letter-spacing: -0.02em;
  line-height: 1.25;
}

.story-meta-time {
  font-size: 12px;
  font-weight: 600;
  color: var(--muted);
  margin: 3px 0 10px;
  display: flex;
  align-items: center;
  gap: 5px;
}

/* Full Photo Grid Layouts (Every single image visible) */
.story-full-gallery {
  display: grid;
  gap: 6px;
  border-radius: var(--radius-inner);
  overflow: hidden;
  margin-top: 12px;
}

.story-full-gallery.grid-1 {
  grid-template-columns: 1fr;
}
.story-full-gallery.grid-1 .story-gallery-item {
  height: 280px;
}

.story-full-gallery.grid-2 {
  grid-template-columns: 1fr 1fr;
}
.story-full-gallery.grid-2 .story-gallery-item {
  height: 180px;
}

.story-full-gallery.grid-3 {
  grid-template-columns: 1fr 1fr;
  grid-template-rows: 150px 150px;
}
.story-full-gallery.grid-3 .story-gallery-item:first-child {
  grid-row: span 2;
  height: 306px;
}
.story-full-gallery.grid-3 .story-gallery-item {
  height: 150px;
}

.story-full-gallery.grid-4 {
  grid-template-columns: 1fr 1fr;
}
.story-full-gallery.grid-4 .story-gallery-item {
  height: 150px;
}

.story-full-gallery.grid-5,
.story-full-gallery.grid-6,
.story-full-gallery.grid-many {
  grid-template-columns: repeat(3, 1fr);
}
.story-full-gallery.grid-5 .story-gallery-item,
.story-full-gallery.grid-6 .story-gallery-item,
.story-full-gallery.grid-many .story-gallery-item {
  height: 130px;
}

.story-gallery-item {
  border-radius: 8px;
  overflow: hidden;
  background: #1e293b;
  position: relative;
  cursor: pointer;
}

.story-gallery-item img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
  transition: transform 0.25s ease;
}

.story-gallery-item:hover img {
  transform: scale(1.04);
}

@media (max-width: 480px) {
  .story-full-gallery.grid-5,
  .story-full-gallery.grid-6,
  .story-full-gallery.grid-many {
    grid-template-columns: repeat(2, 1fr);
  }
  .story-full-gallery.grid-5 .story-gallery-item,
  .story-full-gallery.grid-6 .story-gallery-item,
  .story-full-gallery.grid-many .story-gallery-item {
    height: 140px;
  }
}

.story-caption-text {
  font-size: 13.5px;
  line-height: 1.55;
  color: var(--ink-secondary);
  margin: 0;
  white-space: pre-line;
}

/* --------------------------------------------------------------------------
   5. Interactive Map & Highlights Tabs
   -------------------------------------------------------------------------- */
.tab-content-pane {
  display: none;
}

.tab-content-pane.active {
  display: block;
}

.map-card-container {
  background: #ffffff;
  border: 1px solid var(--border-card);
  border-radius: var(--radius-card);
  overflow: hidden;
  box-shadow: var(--shadow-card);
}

.map-header-bar {
  padding: 14px 16px;
  border-bottom: 1px solid var(--border-card);
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 8px;
}

.map-header-bar h2 {
  margin: 0;
  font-size: 17px;
  font-weight: 800;
  color: var(--ink);
}

.map-viewport {
  height: 60vh;
  min-height: 400px;
  max-height: 600px;
  width: 100%;
}

.map-pills-row {
  display: flex;
  gap: 6px;
  overflow-x: auto;
  padding: 10px 12px;
  background: #ffffff;
  border-top: 1px solid var(--border-card);
}

.map-quick-pill {
  flex: 0 0 auto;
  background: var(--panel-gray);
  border: 1px solid var(--border-card);
  padding: 5px 12px;
  border-radius: var(--radius-pill);
  font-size: 12px;
  font-weight: 700;
  color: var(--ink-secondary);
  cursor: pointer;
}

/* Highlights Grid */
.highlights-card-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
  gap: 12px;
}

.highlight-item-card {
  background: #ffffff;
  border: 1px solid var(--border-card);
  border-radius: var(--radius-inner);
  overflow: hidden;
  cursor: pointer;
  transition: transform 0.2s ease, box-shadow 0.2s ease;
}

.highlight-item-card:hover {
  transform: translateY(-2px);
  box-shadow: var(--shadow-card);
}

.highlight-thumb-box {
  height: 140px;
  overflow: hidden;
  background: #1e293b;
}

.highlight-thumb-box img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.highlight-body-box {
  padding: 10px 12px;
}

.highlight-loc-tag {
  font-size: 11px;
  font-weight: 700;
  color: var(--blue);
  margin-bottom: 2px;
}

.highlight-caption-text {
  font-size: 12px;
  color: var(--ink-secondary);
  line-height: 1.4;
  margin: 0;
}

/* --------------------------------------------------------------------------
   6. Search & Day Filter Drawer
   -------------------------------------------------------------------------- */
.drawer-backdrop {
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.4);
  backdrop-filter: blur(4px);
  z-index: 1800;
  visibility: hidden;
  opacity: 0;
  transition: all 0.2s ease;
}

.drawer-backdrop.show {
  visibility: visible;
  opacity: 1;
}

.drawer-sheet {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  max-width: 580px;
  margin: 0 auto;
  background: #ffffff;
  border-radius: 24px 24px 0 0;
  padding: 20px 16px 32px;
  z-index: 1810;
  transform: translateY(100%);
  transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1);
  box-shadow: 0 -10px 40px rgba(0, 0, 0, 0.15);
  max-height: 80vh;
  overflow-y: auto;
}

.drawer-sheet.show {
  transform: translateY(0);
}

.drawer-drag-handle {
  width: 36px;
  height: 4px;
  background: #e5e7eb;
  border-radius: 2px;
  margin: -8px auto 14px;
}

.drawer-header-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 14px;
}

.drawer-title {
  margin: 0;
  font-size: 17px;
  font-weight: 800;
  color: var(--ink);
}

.drawer-search-input {
  width: 100%;
  background: var(--panel-gray);
  border: 1px solid var(--border-card);
  border-radius: var(--radius-inner);
  padding: 10px 12px;
  font-size: 13.5px;
  color: var(--ink);
  outline: none;
  margin-bottom: 14px;
}

.drawer-days-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
}

.drawer-day-pill {
  background: var(--panel-gray);
  border: 1px solid var(--border-card);
  border-radius: var(--radius-inner);
  padding: 9px 12px;
  text-align: left;
  font-size: 12.5px;
  font-weight: 700;
  color: var(--ink-secondary);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.drawer-day-pill.active {
  background: var(--ink);
  color: #ffffff;
  border-color: var(--ink);
}

/* --------------------------------------------------------------------------
   7. Floating Bottom Navigation Dock (1:1 with Mockup)
   -------------------------------------------------------------------------- */
.bottom-nav-dock {
  position: fixed;
  bottom: 14px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 1000;
  display: flex;
  align-items: center;
  justify-content: space-around;
  background: #ffffff;
  padding: 5px 12px;
  border-radius: var(--radius-pill);
  box-shadow: var(--shadow-dock);
  border: 1px solid rgba(0, 0, 0, 0.06);
  width: calc(100% - 28px);
  max-width: 420px;
}

.dock-item {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  padding: 5px 10px;
  border: none;
  background: transparent;
  color: #6b7280;
  cursor: pointer;
  border-radius: 10px;
  transition: all 0.15s ease;
}

.dock-item svg {
  width: 19px;
  height: 19px;
  stroke-width: 2.2;
}

.dock-item-label {
  font-size: 10.5px;
  font-weight: 700;
}

.dock-item.active {
  color: var(--ink);
}

/* --------------------------------------------------------------------------
   8. Modals, Pins, Lightbox
   -------------------------------------------------------------------------- */
.custom-pin {
  width: 30px;
  height: 30px;
  border-radius: 50%;
  background: var(--blue);
  color: #ffffff;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 14px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.25);
  border: 2px solid #ffffff;
  cursor: pointer;
}

.custom-pin.current {
  background: #10b981;
  box-shadow: 0 0 0 4px rgba(16,185,129,0.4), 0 4px 12px rgba(0,0,0,0.3);
}

.lightbox-modal {
  position: fixed;
  inset: 0;
  background: rgba(17, 24, 39, 0.94);
  backdrop-filter: blur(8px);
  z-index: 2000;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 16px;
  visibility: hidden;
  opacity: 0;
  pointer-events: none;
  transition: all 0.2s ease;
}

.lightbox-modal.show {
  visibility: visible;
  opacity: 1;
  pointer-events: auto;
}

.lightbox-box {
  max-width: min(94vw, 1000px);
  max-height: min(90vh, 820px);
  display: flex;
  flex-direction: column;
  align-items: center;
}

.lightbox-box img,
.lightbox-box video {
  max-width: 100%;
  max-height: 76vh;
  border-radius: 12px;
  box-shadow: 0 12px 40px rgba(0,0,0,0.6);
  object-fit: contain;
}

.lightbox-caption {
  color: #f3f4f6;
  margin-top: 12px;
  font-size: 14px;
  text-align: center;
  max-width: 720px;
  line-height: 1.5;
}

.lightbox-close {
  position: absolute;
  top: 20px;
  right: 20px;
  background: rgba(255, 255, 255, 0.2);
  color: #ffffff;
  border: 0;
  border-radius: 50%;
  width: 40px;
  height: 40px;
  font-size: 22px;
  font-weight: 700;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
}

.place-modal-backdrop {
  position: fixed;
  inset: 0;
  background: rgba(17, 24, 39, 0.5);
  backdrop-filter: blur(4px);
  z-index: 1500;
  visibility: hidden;
  opacity: 0;
  pointer-events: none;
  transition: all 0.2s ease;
}

.place-modal-backdrop.show {
  visibility: visible;
  opacity: 1;
  pointer-events: auto;
}

.place-modal {
  position: fixed;
  left: 50%;
  top: 50%;
  transform: translate(-50%, -50%) scale(0.96);
  width: min(500px, calc(100vw - 32px));
  max-height: 85vh;
  background: #ffffff;
  border-radius: var(--radius-card);
  box-shadow: 0 20px 50px rgba(17, 24, 39, 0.25);
  z-index: 1510;
  overflow-y: auto;
  padding: 22px;
  visibility: hidden;
  opacity: 0;
  pointer-events: none;
  transition: all 0.2s ease;
}

.place-modal.show {
  visibility: visible;
  opacity: 1;
  pointer-events: auto;
  transform: translate(-50%, -50%) scale(1);
}

.place-modal-close {
  position: absolute;
  top: 14px;
  right: 14px;
  border: 0;
  background: var(--panel-gray);
  color: var(--ink-secondary);
  width: 30px;
  height: 30px;
  border-radius: 50%;
  font-size: 16px;
  font-weight: 700;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
}

</style>
</head>
<body>
<div class="app-container">

  <!-- 1. Header (1:1 with Mockup) -->
  <header class="header-wrap">
    <div class="header-top">
      <h1 class="header-title">Japan Journey 2026</h1>
      <div class="day-badge-top">Day 10 of 13</div>
    </div>
    
    <div class="avatar-crew-row">
      <div class="avatar-group">
        <img src="assets/photos/53_ueno_father_son_smiling_selfie.jpg" alt="John" title="John">

      </div>
      <div class="crew-names-text">
        John, Brittany,<br>Lincoln, Evelyn
      </div>
    </div>
  </header>

  <!-- 2. Bento Card (1:1 with Mockup) -->
  <section class="bento-card">

    </div>

    <div class="bento-content-row">
      <div class="bento-stats-group">
        <div class="bento-stat-col">

            <span>61</span>
          </div>
          <div class="bento-stat-sub">Stories</div>
        </div>

        <div class="bento-stat-col">
          <div class="bento-stat-top">
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
            <span>440</span>
          </div>
          <div class="bento-stat-sub">Photos</div>
        </div>

        <div class="bento-stat-col">

// --- RENDER FUNCTIONS ---

function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

// Day Filtering State
let selectedDay = 'all';
let searchQuery = '';

function getPostDayKey(dateStr) {
  if (!dateStr) return '';
  const match = String(dateStr).match(/^([A-Za-z]{3}\s+[A-Za-z]{3}\s+\d{1,2})/);
  return match ? match[1] : dateStr.split('·')[0].trim();
}

function renderFeed() {
  const container = document.getElementById('feedContainer');
  if (!container) return;
  
  let filteredPosts = selectedDay === 'all' 
    ? tripPosts 
    : tripPosts.filter(p => getPostDayKey(p.date) === selectedDay);

  if (searchQuery.trim()) {
    const q = searchQuery.toLowerCase();
    filteredPosts = filteredPosts.filter(p => 
      (p.title && p.title.toLowerCase().includes(q)) ||
      (p.caption && p.caption.toLowerCase().includes(q)) ||
      (p.location && p.location.toLowerCase().includes(q))
    );
  }

  if (!filteredPosts.length) {
    container.innerHTML = '<div class="story-card" style="padding:40px;text-align:center;"><p style="color:var(--muted);margin:0;">No updates found.</p></div>';
    return;
  }
  
  container.innerHTML = filteredPosts.map((post) => {
    const pIdx = tripPosts.indexOf(post);
    let topHeroPhotoHtml = '';
    let videosHtml = '';
    let companionGridHtml = '';

    if (post.media && post.media.length > 0) {
      const videos = [];
      const photos = [];

      post.media.forEach((m, mIdx) => {
        if (m.type === 'video') {
          videos.push({ media: m, mIdx });
        } else {
          photos.push({ media: m, mIdx });
        }
      });

      // 1. Featured Videos (Inline players)
      if (videos.length > 0) {
        videosHtml = videos.map(vObj => {
          return '<div class="story-video-wrap" style="margin-bottom:14px;border-radius:var(--radius-inner);overflow:hidden;background:#000;">' +
            '<video src="' + vObj.media.url + '" controls preload="metadata" playsinline style="width:100%;max-height:420px;display:block;"></video>' +
            (vObj.media.caption ? '<div style="padding:8px 14px;background:#111827;color:#e5e7eb;font-size:12px;font-weight:600;">🎬 ' + esc(vObj.media.caption) + '</div>' : '') +
          '</div>';
        }).join('');
      }

      // 2. All Photos: Hero Photo (1st) on Top + Companion Grid Below Story Text
      if (photos.length > 0) {
        const firstPhoto = photos[0];
        topHeroPhotoHtml = '<div class="story-hero-media" onclick="openLightbox(\'' + firstPhoto.media.url + '\', \'image\', \'' + esc(firstPhoto.media.caption || post.title) + '\')">' +
          '<img src="' + (firstPhoto.media.thumb || firstPhoto.media.url) + '" alt="' + esc(post.title) + '" loading="lazy">' +
        '</div>';

        // Secondary Photos Grid below story caption
        if (photos.length > 1) {
          const companionPhotos = photos.slice(1);
          const len = companionPhotos.length;
          let gridClass = 'grid-many';
          if (len === 1) gridClass = 'grid-1';
          else if (len === 2) gridClass = 'grid-2';
          else if (len === 3) gridClass = 'grid-3';
          else if (len === 4) gridClass = 'grid-4';

          const companionHtml = companionPhotos.map(pObj => {
            return '<div class="story-gallery-item" onclick="openLightbox(\'' + pObj.media.url + '\', \'image\', \'' + esc(pObj.media.caption || post.title) + '\')">' +
              '<img src="' + (pObj.media.thumb || pObj.media.url) + '" alt="' + esc(pObj.media.caption || post.title) + '" loading="lazy">' +
            '</div>';
          }).join('');

          companionGridHtml = '<div class="story-full-gallery ' + gridClass + '">' + companionHtml + '</div>';
        }
      }
    }

    return '<article class="story-card">' +
      topHeroPhotoHtml +
      '<div class="story-content-wrap">' +
        '<h2 class="story-title">' + esc(post.title) + '</h2>' +
        '<div class="story-meta-time">' + esc(post.date) + (post.location ? ' · 📍 ' + esc(post.location) : '') + '</div>' +
        '<p class="story-caption-text">' + esc(post.caption) + '</p>' +
      '</div>' +
      videosHtml +
      companionGridHtml +
    '</article>';
  }).join('');
}

// Drawer Controls
function openDrawer() {
  document.getElementById('drawerBackdrop').classList.add('show');
  document.getElementById('drawerSheet').classList.add('show');
}

function closeDrawer() {
  document.getElementById('drawerBackdrop').classList.remove('show');
  document.getElementById('drawerSheet').classList.remove('show');
}

function renderDrawerDays() {
  const container = document.getElementById('drawerDaysContainer');
  if (!container) return;

  const dayCounts = {};
  const dayOrder = [];
  
  tripPosts.forEach(post => {
    const k = getPostDayKey(post.date);
    if (!k) return;
    if (!dayCounts[k]) {
      dayCounts[k] = 0;
      dayOrder.push(k);
    }
    dayCounts[k]++;
  });

  const dayLabels = {
    'Sun Aug 30': 'Day 10 · Shibuya & Yoyogi',
    'Sat Aug 29': 'Day 9 · Shibuya Base',
    'Fri Aug 28': 'Day 8 · Atami Water Park',
    'Thu Aug 27': 'Day 7 · Shinkansen to Atami',
    'Wed Aug 26': 'Day 6 · Toy Kingdom',
    'Tue Aug 25': 'Day 5 · Karuizawa',
    'Mon Aug 24': 'Day 4 · Sanrio Puroland',
    'Sun Aug 23': 'Day 3 · Akihabara & Ueno',
    'Sat Aug 22': 'Day 2 · Tokyo Arrival',
    'Fri Aug 21': 'Day 1 · The O’Hare Dash'
  };

  let html = '<button class="drawer-day-pill ' + (selectedDay === 'all' ? 'active' : '') + '" onclick="selectDayFromDrawer(\'all\')">' +
    '<span>✨ All Days</span> <span>' + tripPosts.length + '</span>' +
    '</button>';

  dayOrder.forEach(dayKey => {
    const label = dayLabels[dayKey] || dayKey;
    const isActive = selectedDay === dayKey;
    const count = dayCounts[dayKey] || 0;
    html += '<button class="drawer-day-pill ' + (isActive ? 'active' : '') + '" onclick="selectDayFromDrawer(\'' + esc(dayKey) + '\')">' +
      '<span>' + esc(label) + '</span> <span>' + count + '</span>' +
      '</button>';
  });

  container.innerHTML = html;
}

function selectDayFromDrawer(dayKey) {
  selectedDay = dayKey;
  renderDrawerDays();
  renderFeed();
  closeDrawer();
  switchTab('feed');
}

function onSearchInput(val) {
  searchQuery = val;
  renderFeed();
}

// Lightbox
function openLightbox(url, type, caption) {
  const lb = document.getElementById('lightboxModal');
  const box = document.getElementById('lightboxBox');
  if (!lb || !box) return;
  if (type === 'video') {
    box.innerHTML = '<video src="' + url + '" controls autoplay playsinline></video><p class="lightbox-caption">' + esc(caption) + '</p>';
  } else {
    box.innerHTML = '<img src="' + url + '" alt="' + esc(caption) + '"><p class="lightbox-caption">' + esc(caption) + '</p>';
  }
  lb.classList.add('show');
}

function closeLightbox() {
  const lb = document.getElementById('lightboxModal');
  if (lb) {
    lb.classList.remove('show');
    const box = document.getElementById('lightboxBox');
    if (box) box.innerHTML = '';
  }
}

// Place Detail Modal
function openPlaceModal(pin) {
  const modal = document.getElementById('placeModal');
  const backdrop = document.getElementById('placeBackdrop');
  const content = document.getElementById('placeContent');
  if (!modal || !content) return;
  
  content.innerHTML = '<h3 style="margin:0 0 6px;font-size:18px;font-weight:800;">' + pin.icon + ' ' + esc(pin.name) + '</h3>' +
    '<div style="margin-bottom:12px;display:flex;gap:6px;align-items:center;flex-wrap:wrap">' +
      '<span style="background:#fff2ed;color:#ff5722;padding:3px 8px;border-radius:6px;font-size:11px;font-weight:800;">' + (pin.status === 'current' ? '🟢 Current Base' : pin.status === 'visited' ? '✅ Visited' : '⏳ Planned') + '</span>' +
      (pin.tag ? '<span style="background:#f3f4f6;color:#4b5563;padding:3px 8px;border-radius:6px;font-size:11px;font-weight:700;">' + esc(pin.tag) + '</span>' : '') +
    '</div>' +
    '<p style="font-size:14px;line-height:1.6;color:#4b5563;margin:0 0 12px;">' + esc(pin.desc) + '</p>' +
    '<a style="display:inline-flex;align-items:center;gap:6px;background:#111827;color:#fff;padding:9px 15px;border-radius:8px;font-weight:700;font-size:13.5px;" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(pin.lat + ',' + pin.lon) + '">📍 Open in Google Maps ↗</a>';
  backdrop.classList.add('show');
  modal.classList.add('show');
}

function closePlaceModal() {
  document.getElementById('placeBackdrop').classList.remove('show');
  document.getElementById('placeModal').classList.remove('show');
}

// Tab Switching
function switchTab(tab) {
  // Top Switcher
  const btnFeed = document.getElementById('btnSwitchFeed');
  const btnMap = document.getElementById('btnSwitchMap');
  if (btnFeed && btnMap) {
    btnFeed.classList.toggle('active', tab === 'feed');
    btnMap.classList.toggle('active', tab === 'map');
  }

  // Dock Buttons
  document.getElementById('dockTimeline').classList.toggle('active', tab === 'feed');
  document.getElementById('dockMap').classList.toggle('active', tab === 'map');
  document.getElementById('dockFavorites').classList.toggle('active', tab === 'favorites');
  document.getElementById('dockSearch').classList.toggle('active', false);

  // Panes
  document.getElementById('paneFeed').classList.toggle('active', tab === 'feed');
  document.getElementById('paneMap').classList.toggle('active', tab === 'map');
  document.getElementById('paneFavorites').classList.toggle('active', tab === 'favorites');

  window.scrollTo({ top: 0, behavior: 'instant' });
  if (tab === 'map' && window.map) {
    setTimeout(() => {
      window.map.invalidateSize();
      zoomTo('japan');
    }, 100);
  }
}

function renderHighlights() {
  const container = document.getElementById('highlightsContainer');
  if (!container || typeof recentHighlights === 'undefined') return;
  container.innerHTML = recentHighlights.map((item) => {
    return '<div class="highlight-item-card" onclick="openLightbox(\'' + item.url + '\', \'image\', \'' + esc(item.caption) + '\')">' +
      '<div class="highlight-thumb-box">' +
        '<img src="' + item.thumb + '" alt="' + esc(item.caption) + '" loading="lazy">' +
      '</div>' +
      '<div class="highlight-body-box">' +
        '<div class="highlight-loc-tag">📍 ' + esc(item.location) + '</div>' +
        '<p class="highlight-caption-text">' + esc(item.caption) + '</p>' +
      '</div>' +
    '</div>';
  }).join('');
}

// Map Initialization
let map = null;
function initMap() {
  map = window.map = L.map('map', {
    zoomControl: true,
    worldCopyJump: false
  }).setView([35.4, 137.5], 7);

  L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
    maxZoom: 18,
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> &copy; CARTO'
  }).addTo(map);

  // Routes
  L.polyline(visitedMainRoute, { color: '#2563eb', weight: 4, opacity: 0.9, lineCap: 'round', lineJoin: 'round' }).addTo(map);
  L.polyline(visitedTokyoRoute, { color: '#ff5722', weight: 3.5, opacity: 0.85, dashArray: '6, 8', lineCap: 'round' }).addTo(map);
  L.polyline(plannedRouteCoords, { color: '#9ca3af', weight: 2.5, opacity: 0.6, dashArray: '4, 8', lineCap: 'round' }).addTo(map);

  // Markers
  mapPins.forEach(pin => {
    const statusClass = pin.status === 'current' ? 'current' : pin.status === 'planned' ? 'planned' : 'visited';
    const icon = L.divIcon({
      className: '',
      html: '<div class="custom-pin ' + pin.type + ' ' + statusClass + '" title="' + esc(pin.name) + '">' + pin.icon + '</div>',
      iconSize: [30, 30],
      iconAnchor: [15, 15]
    });
    const marker = L.marker([pin.lat, pin.lon], { icon }).addTo(map);
    marker.on('click', () => {
      openPlaceModal(pin);
    });
  });

  zoomTo('japan');
}

function zoomTo(region) {
  if (!map) return;
  if (region === 'japan') {
    map.fitBounds([[34.4, 134.5], [36.6, 140.6]], { padding: [30, 30] });
  } else if (region === 'karuizawa') {
    map.flyTo([36.355, 138.635], 14, { duration: 0.8 });
  } else if (region === 'tokyo') {
    map.flyTo([35.695, 139.755], 12, { duration: 0.8 });
  } else if (region === 'kansai') {
    map.flyTo([34.85, 135.65], 10, { duration: 0.8 });
  } else if (region === 'shibuya') {
    map.flyTo([35.658, 139.699], 15, { duration: 0.8 });
  } else if (region === 'atami') {
    map.flyTo([35.097, 139.076], 13, { duration: 0.8 });
  } else if (region === 'coast') {
    map.flyTo([35.62, 135.4], 9, { duration: 0.8 });
  }
}

// Init
document.addEventListener('DOMContentLoaded', () => {
  renderHighlights();
  renderDrawerDays();
  renderFeed();
  initMap();
